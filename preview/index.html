<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<script>
  window.PREVIEW_MODE = /dark/.test(location.pathname) || new URLSearchParams(location.search).get('mode') === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.mode = window.PREVIEW_MODE;
</script>
<!-- Same load order as an MFE: Paragon core + brand core, then the variant (Paragon light + brand light|dark). -->
<link rel="stylesheet" href="/paragon/core.css">
<link rel="stylesheet" href="/brand/core.css">
<link rel="stylesheet" href="/paragon/light.css">
<script>document.write(`<link rel="stylesheet" href="/brand/${window.PREVIEW_MODE}.css">`);</script>
<style>
  /* Logical properties (inline-start / inline-end) so the layout mirrors in right-to-left languages. */
  body { background: var(--pgn-color-bg-base); color: var(--pgn-color-body-base); text-align: start; }
  html[data-mode="dark"] { color-scheme: dark; }
  .preview-header { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
  .preview-header-actions, .preview-card-actions { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; }
  .preview-card-actions { flex: none; justify-content: flex-end; }
  .preview-count-badge { margin-inline-start: .5rem; }
  .preview-mode-tabs { gap: .75rem; margin-bottom: 2rem; }
  .preview-mode-tabs .nav-link { min-width: 7rem; text-align: center; }
  .preview-layout { display: grid; grid-template-columns: 15rem minmax(0, 1fr); gap: 2.5rem; align-items: start; }
  .preview-sidebar { position: sticky; top: 1rem; max-height: calc(100vh - 2rem); overflow-y: auto; display: flex; flex-direction: column;
    gap: 1rem; padding-inline-end: .5rem; border-inline-end: 1px solid var(--pgn-color-light-400); }
  .preview-sidebar-heading { display: flex; width: 100%; align-items: center; justify-content: space-between; gap: .5rem; padding: .375rem .5rem;
    border: 0; border-radius: .25rem; background: none; color: var(--pgn-color-headings-base, var(--pgn-color-body-base));
    font-size: 1.125rem; font-weight: 700; text-align: start; cursor: pointer; }
  .preview-sidebar-heading:hover { background: var(--pgn-color-light-200); }
  .preview-sidebar-links { display: flex; flex-direction: column; gap: .125rem; margin-top: .25rem; }
  .preview-sidebar-links a { padding-block: .2rem; padding-inline: 1rem .5rem; border-radius: .25rem; text-decoration: none; }
  .preview-sidebar-links a:hover { background: var(--pgn-color-light-200); }
  @media (max-width: 991.98px) {
    .preview-layout { grid-template-columns: minmax(0, 1fr); }
    .preview-sidebar { position: static; max-height: none; border-inline-end: 0; }
    .preview-sidebar-links { flex-direction: row; flex-wrap: wrap; }
  }
  .preview-step { display: flex; gap: 1rem; align-items: flex-start; margin: 0 0 1.5rem; padding-top: .5rem; }
  #step-2 .preview-step { margin-top: 3.5rem; padding-top: 2rem; border-top: 2px solid var(--pgn-color-light-400); }
  .preview-step-number { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 2.5rem; height: 2.5rem;
    border-radius: 50%; background: var(--pgn-color-primary-base); color: var(--pgn-color-white); font-weight: 700; font-size: 1.25rem; }
  .preview-card { border: 1px solid var(--pgn-color-gray-300); border-radius: .5rem; margin-bottom: 2.5rem; scroll-margin-top: 1rem;
    background: var(--pgn-color-bg-base); box-shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 2px 8px rgba(0, 0, 0, .06); }
  .preview-card-header { display: flex; flex-wrap: wrap; gap: 1rem 1.5rem; justify-content: space-between; align-items: flex-start; padding: 1.25rem 1.5rem;
    background: var(--pgn-color-light-200); border-bottom: 1px solid var(--pgn-color-gray-300); border-radius: .5rem .5rem 0 0; }
  .preview-card-header > div:first-child { flex: 1 1 24rem; min-width: 0; }
  .preview-card-header p { max-width: 60rem; }
  .preview-card-kicker { font-size: .75rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--pgn-color-gray-500); }
  .preview-card-meta { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  /* Clip wide demos at the card edge, not the demo edge, so shadows and focus rings of flush components stay visible. */
  .preview-card-body { padding: 1.5rem; overflow-x: clip; }
  /* flow-root contains floated Paragon parts (e.g. .dropdown-menu floats left) so they cannot spill into the next card. */
  .preview-demo { position: relative; display: flow-root; }
  .preview-demo > :last-child { margin-bottom: 0; }
  .preview-tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(11rem, 1fr)); gap: 1rem; margin-top: 1.25rem; }
  .preview-tile { border: 1px solid var(--pgn-color-light-400); border-radius: .375rem; padding: .625rem; min-width: 0; }
  .preview-tile-visual { height: 3rem; display: flex; align-items: center; margin-bottom: .375rem; }
  .preview-tile-color { width: 100%; height: 100%; border-radius: .25rem; border: 1px solid var(--pgn-color-gray-300); }
  .preview-tile-shadow { width: 70%; height: 70%; border-radius: .25rem; background: var(--pgn-color-bg-base); margin-inline-start: .5rem; }
  .preview-tile-text { font-size: 1.75rem; line-height: 1; }
  .preview-tile-radius { width: 3rem; height: 2.5rem; border: 2px solid var(--pgn-color-primary-base); }
  .preview-tile-bar { height: .75rem; min-width: 2px; background: var(--pgn-color-primary-base); border-radius: 2px; }
  .preview-tile-name { font-size: .8125rem; font-weight: 600; overflow-wrap: anywhere; }
  .preview-tile-value { display: block; font-size: .75rem; overflow-wrap: anywhere; }
  .preview-layout-block { padding: .5rem .75rem; border: 1px dashed var(--pgn-color-gray-300); border-radius: .25rem; background: var(--pgn-color-light-200); }
  /* Paragon places the close button over the end of the header without reserving room for it. */
  .preview-dialog .pgn__modal-header { padding-inline-end: 4.5rem; }
  .preview-edit-group { border: 1px solid var(--pgn-color-gray-300); border-radius: .375rem; margin-bottom: 1.25rem; }
  .preview-edit-group > summary { cursor: pointer; padding: .75rem 1rem; background: var(--pgn-color-light-200); border-radius: .375rem; }
  .preview-edit-row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(12rem, 1fr) 12rem; gap: .5rem 1.25rem; align-items: start;
    padding: 1rem; border-top: 1px solid var(--pgn-color-light-400); }
  .preview-edit-label { display: flex; flex-direction: column; gap: .25rem; }
  .preview-edit-description { color: var(--pgn-color-body-base); }
  .preview-edit-input { display: flex; gap: .5rem; align-items: center; }
  .preview-color-input { flex: none; width: 2.5rem; height: 2rem; padding: 0; border: 1px solid var(--pgn-color-gray-300); border-radius: .25rem; background: none; cursor: pointer; }
  .preview-edit-status { display: flex; flex-wrap: wrap; gap: .25rem .5rem; align-items: center; }
  .preview-edit-history { grid-column: 1 / -1; padding: .75rem 1rem; border-radius: .375rem; background: var(--pgn-color-light-200); }
  .preview-history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1rem; }
  .preview-history-entry { padding: .875rem 1rem; border: 1px solid var(--pgn-color-light-400); border-radius: .375rem; background: var(--pgn-color-bg-base); }
  .preview-history-entry-header { display: flex; flex-wrap: wrap; gap: .5rem 1rem; justify-content: space-between; align-items: flex-start; margin-bottom: .5rem; }
  .preview-history-reverted { max-width: 16rem; }
  .preview-history-changes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .375rem; font-size: .875rem; }
  .preview-history-changes li { display: flex; flex-wrap: wrap; gap: .25rem 1rem; }
  .preview-history-label { font-weight: 600; min-width: 12rem; }
  .preview-history-value { display: inline-flex; gap: .375rem; align-items: center; }
  .preview-history-swatch { display: inline-block; width: 1rem; height: 1rem; border-radius: .125rem; border: 1px solid var(--pgn-color-gray-300); }
  .preview-import-summary { padding-inline-start: 1.25rem; margin-bottom: 1.25rem; }
  .preview-import-choice { margin-bottom: 1.25rem; }
  .preview-import-list { margin-bottom: 1rem; }
  .preview-import-invalid { padding-top: 1rem; border-top: 1px solid var(--pgn-color-light-400); }
  @media (max-width: 767.98px) { .preview-edit-row { grid-template-columns: minmax(0, 1fr); } }
  .preview-row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin-bottom: 1rem; }
  .preview-row > * { max-width: 100%; }
  .preview-demo .pagination, .preview-demo .btn-group, .preview-demo .pgn__breadcrumb ol,
  .preview-demo .pgn__data-table-footer { flex-wrap: wrap; row-gap: .5rem; }
  .preview-demo .dropdown-menu.position-static { float: inline-start; min-width: min(var(--pgn-size-dropdown-min-width), 100%); }
  .preview-demo .pgn__selectable_box-set { grid-template-columns: repeat(auto-fit, minmax(min(9rem, 100%), 1fr)); }
  .preview-dark-bar { background: var(--pgn-color-dark-base); padding: .75rem; border-radius: .375rem; }
  .preview-label { font-size: .8125rem; font-weight: 600; color: var(--pgn-color-gray-500); margin: 1rem 0 .4rem; }
  .preview-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(18rem, 100%), 1fr)); gap: 1.5rem; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="/app.js"></script>
</body>
</html>
